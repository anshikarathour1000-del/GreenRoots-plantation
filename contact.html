<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | GreenRoots</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>

<header class="navbar">
    <h2>🌱 GreenRoots</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="donation.html">Donate</a>
        <a href="contact.html">Contact Us</a>
    </nav>
</header>

<section class="hero">
    <h1>Contact Us</h1>
    <p>We would love to hear from you. Let's make our planet greener!</p>
</section>

<main class="container">

    <!-- Contact Form -->
    <section class="form-card">
        <h2>📩 Get In Touch</h2>
        <p>Send us your questions or suggestions.</p>

        <form id="contactForm">

            <label>Full Name</label>
            <input type="text" id="contactName"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="contactEmail"
                   placeholder="Enter your email" required>

            <label>Mobile Number</label>
            <input type="tel" id="contactPhone"
                   placeholder="10 digit mobile number"
                   pattern="[0-9]{10}" required>

            <label>Subject</label>
            <input type="text" id="contactSubject"
                   placeholder="Enter subject" required>

            <label>Your Message</label>
            <textarea id="contactMessage"
                      placeholder="Write your message..."
                      required></textarea>

            <button type="submit">Send Message</button>
            <p id="contactStatus" class="status"></p>

        </form>
    </section>

    <!-- Feedback Form -->
    <section class="form-card">
        <h2>⭐ Share Your Feedback</h2>
        <p>Your feedback helps GreenRoots improve.</p>

        <form id="feedbackForm">

            <label>Your Name</label>
            <input type="text" id="feedbackName"
                   placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="feedbackEmail"
                   placeholder="Enter your email" required>

            <label>Rate Your Experience</label>
            <select id="feedbackRating" required>
                <option value="">Select Rating</option>
                <option value="5">⭐⭐⭐⭐⭐ Excellent</option>
                <option value="4">⭐⭐⭐⭐ Very Good</option>
                <option value="3">⭐⭐⭐ Good</option>
                <option value="2">⭐⭐ Fair</option>
                <option value="1">⭐ Poor</option>
            </select>

            <label>Your Feedback</label>
            <textarea id="feedbackMessage"
                      placeholder="Write your feedback..."
                      required></textarea>

            <button type="submit">Submit Feedback</button>
            <p id="feedbackStatus" class="status"></p>

        </form>
    </section>

</main>

<footer>
    <p>© 2026 GreenRoots | Growing a Greener Future 🌳</p>
</footer>

<script src="contact.js"></script>
</body>
</html>
