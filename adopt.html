<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Adoption - GreenRoots</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef7e9;
            padding: 30px 15px;
        }

        .container {
            max-width: 500px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
        }

        h1 {
            text-align: center;
            color: #287a32;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #333;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #398c36;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #236d28;
        }

        #success {
            display: none;
            color: green;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #287a32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌳 Adopt a Tree</h1>

    <p>Become a part of our GreenRoots mission!</p>

    <form id="adoptForm">

        <label>Your Name</label>
        <input type="text" id="name" required
        placeholder="Enter your name">

        <label>Email Address</label>
        <input type="email" id="email" required
        placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="tel" id="phone" required
        pattern="[0-9]{10}" maxlength="10"
        placeholder="Enter 10 digit mobile number">

        <label>Select Your Tree</label>
        <select id="tree" required>
            <option value="">Choose a tree</option>
            <option value="Neem Tree">Neem Tree</option>
            <option value="Mango Tree">Mango Tree</option>
            <option value="Banyan Tree">Banyan Tree</option>
        </select>

        <label>Your Address</label>
        <textarea id="address" rows="3"
        required placeholder="Enter your address"></textarea>

        <button type="submit">Submit Adoption Request</button>

    </form>

    <div id="success">
        🎉 Congratulations! Your tree adoption request
        has been submitted successfully!
    </div>

    <a href="index.html" class="back">← Back to Home</a>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const selectedTree = params.get("tree");

    if (selectedTree) {
        document.getElementById("tree").value = selectedTree;
    }

    document.getElementById("adoptForm")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        const adoption = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            tree: document.getElementById("tree").value,
            address: document.getElementById("address").value
        };

        let requests = JSON.parse(
            localStorage.getItem("adoptions") || "[]"
        );

        requests.push(adoption);
        localStorage.setItem(
            "adoptions",
            JSON.stringify(requests)
        );

        document.getElementById("adoptForm").reset();

        document.getElementById("success").style.display = "block";
    });
</script>

</body>
</html>
